name: CI Pipeline

on:
  push:
    branches: [ main, task18 ]
  pull_request:
    branches: [ main, task18 ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Окружение в CI собирается из poetry.lock — те же версии, что локально.
      - name: Install Poetry
        run: pip install "poetry==2.5.1"

      - name: Check lockfile consistency
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Pre-commit hooks (hygiene, black, ruff)
        run: poetry run pre-commit run --all-files --show-diff-on-failure

      - name: Run pytest
        run: poetry run pytest --cov=backend --cov-report=term-missing

  frontend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Run tests
        run: |
          cd frontend
          npx vitest run --reporter=verbose

      - name: Build
        run: |
          cd frontend
          npm run build

  docker-build:
    needs: [backend-quality, frontend-tests]
    # Сборка образа ТОЛЬКО при push в main (т.е. при мерже PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rag-constructor:latest
